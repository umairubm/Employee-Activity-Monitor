name: Build unsigned Windows test installer

# Separate from agent-v* production releases. An SSH deploy key can trigger
# this workflow by pushing windows-test-* without needing an Actions API token.
on:
  push:
    tags:
      - "windows-test-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-test:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r agent/requirements.txt pyinstaller

      - name: Check installer and update trust contracts
        run: |
          python -m unittest agent.tests.test_windows_installer_verification agent.tests.test_background_processes agent.tests.test_commands agent.packaging.windows.test_installer_contracts

      - name: Generate icons
        run: python agent/packaging/make_icons.py

      - name: Build agent executable
        working-directory: agent/packaging
        run: pyinstaller --noconfirm WorkforceAgent.spec

      - name: Build regular installer without signing
        shell: pwsh
        working-directory: agent/packaging
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\WorkforceAgent.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }

      - name: Label test artifact and record checksum
        shell: pwsh
        run: |
          $path = 'agent/packaging/dist/WorkforceAgent-Setup-UNSIGNED-DEVELOPMENT.exe'
          Move-Item agent/packaging/dist/WorkforceAgent-Setup-windows.exe $path
          $signature = Get-AuthenticodeSignature -LiteralPath $path
          if ($signature.Status -ne 'NotSigned') {
            throw "Expected an unsigned test installer, got $($signature.Status)."
          }
          $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($path))" | Set-Content "$path.sha256" -Encoding ascii
          @(
            'UNSIGNED DEVELOPMENT BUILD - MANUAL TESTING ONLY'
            'Not a trusted production release. Do not distribute for automatic rollout.'
            'The secured remote updater intentionally rejects this installer.'
            'Run the regular installer manually to review enrollment and monitoring consent.'
            'Windows or organization security policies may block an unsigned installer.'
            'No security settings are disabled by this build.'
            "Source commit: $env:GITHUB_SHA"
            "Build ref: $env:GITHUB_REF"
          ) | Set-Content agent/packaging/dist/UNSIGNED-TESTING.txt -Encoding utf8

      # No signing identity, production environment, release upload, or rollout.
      - name: Upload unsigned installer for manual testing
        uses: actions/upload-artifact@v4
        with:
          name: windows-UNSIGNED-DEVELOPMENT-not-for-rollout
          retention-days: 7
          if-no-files-found: error
          path: |
            agent/packaging/dist/WorkforceAgent-Setup-UNSIGNED-DEVELOPMENT.exe
            agent/packaging/dist/WorkforceAgent-Setup-UNSIGNED-DEVELOPMENT.exe.sha256
            agent/packaging/dist/UNSIGNED-TESTING.txt