name: Build macOS Agent (artifact only)

# Builds the macOS agent .app + .dmg natively for BOTH Apple Silicon (arm64)
# and Intel (x86_64) — one runner per arch, since the PyInstaller bundle is
# single-arch — and uploads each as a downloadable Actions artifact.
# Deliberately does NOT publish a GitHub Release and does NOT require signing
# secrets (produces UNSIGNED builds for testing). For a signed/notarized
# release, use build-agent-installers.yml instead.

on:
  workflow_dispatch:
  push:
    branches:
      - ci-macos-artifact

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14        # Apple Silicon
          - arch: x86_64
            runner: macos-15-intel  # Intel (macos-13 was retired 2025-12)
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt pyinstaller

      - name: Generate icons
        run: python agent/packaging/make_icons.py

      - name: Build UNSIGNED .app and .dmg
        run: bash agent/packaging/macos/build_dmg.sh

      - name: Report built architecture
        run: |
          echo "runner arch: $(uname -m)"
          file agent/packaging/dist/WorkforceAgent.app/Contents/MacOS/* || true
          # Minimum macOS the executable will load on (LC_BUILD_VERSION minos).
          otool -l agent/packaging/dist/WorkforceAgent.app/Contents/MacOS/WorkforceAgent \
            | grep -A4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX' || true
          ls -la agent/packaging/dist/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-agent-${{ matrix.arch }}-unsigned
          path: |
            agent/packaging/dist/WorkforceAgent-macos.dmg
            agent/packaging/dist/WorkforceAgent-macos-*.app.zip
          if-no-files-found: error
