name: Build Agent Installers

# Builds the desktop agent into a Windows .exe installer, a macOS .dmg, and a
# Linux .tar.gz, then attaches all three to a GitHub Release. Each platform's
# binary cannot be cross-compiled, so the work runs on native windows-latest /
# macos-latest / ubuntu-latest runners.
#
# Trigger by pushing a tag like `agent-v0.1.0`, or run manually from the Actions
# tab (workflow_dispatch) and supply the tag to publish.

on:
  push:
    tags:
      - "agent-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create/publish (e.g. agent-v0.1.0)"
        required: true
        default: "agent-v0.1.0"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt pyinstaller

      - name: Generate icons
        run: python agent/packaging/make_icons.py

      - name: Build agent executable
        working-directory: agent/packaging
        run: pyinstaller --noconfirm WorkforceAgent.spec

      - name: Build installer (Inno Setup)
        working-directory: agent/packaging
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\WorkforceAgent.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: agent/packaging/dist/WorkforceAgent-Setup-windows.exe

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: agent/packaging/dist/WorkforceAgent-Setup-windows.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt pyinstaller

      - name: Generate icons
        run: python agent/packaging/make_icons.py

      - name: Import Apple Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          test -n "$MACOS_CERTIFICATE"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/workforce-signing.keychain-db"
          echo "$MACOS_CERTIFICATE" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build .app and .dmg
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash agent/packaging/macos/build_dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            agent/packaging/dist/WorkforceAgent-macos.dmg
            agent/packaging/dist/WorkforceAgent-macos-*.app.zip

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: |
            agent/packaging/dist/WorkforceAgent-macos.dmg
            agent/packaging/dist/WorkforceAgent-macos-*.app.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt pyinstaller

      - name: Generate icons
        run: python agent/packaging/make_icons.py

      - name: Build agent executable
        working-directory: agent/packaging
        run: pyinstaller --noconfirm WorkforceAgent.spec

      - name: Package tarball
        working-directory: agent/packaging
        run: |
          chmod +x dist/WorkforceAgent
          tar -czf dist/WorkforceAgent-linux.tar.gz -C dist WorkforceAgent

      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: agent/packaging/dist/WorkforceAgent-linux.tar.gz

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: agent/packaging/dist/WorkforceAgent-linux.tar.gz
