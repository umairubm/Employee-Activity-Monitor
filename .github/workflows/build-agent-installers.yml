name: Build Agent Installers

on:
  push:
    tags:
      - "agent-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create/publish (e.g. agent-v1.2.9)"
        required: true
        default: "agent-v1.2.9"

permissions:
  contents: write

# ── Opt into Node.js 24 now (required after June 16 2026) ─────────────────────
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # actions/checkout v4.2+ ships Node.js 24 support
      - uses: actions/checkout@v4.2.2
        with:
          # Fetch full history so git tag operations work correctly
          fetch-depth: 0

      # actions/setup-python v5.3+ supports Node.js 24 runner
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt "pyinstaller<6.22.0" msvc-runtime

      - name: Generate icons
        run: python agent/packaging/make_icons.py

      - name: Build WorkforceTrack executable
        working-directory: agent/packaging
        shell: pwsh
        run: |
          pyinstaller --noconfirm WorkforceAgent-SystemService.spec

          # Verify the output exists where the .iss script expects it
          if (-not (Test-Path "dist\WorkforceTrack.exe")) {
            throw "PyInstaller failed to produce dist\WorkforceTrack.exe"
          }
          Write-Host "Built: dist\WorkforceTrack.exe"

      - name: Build WorkforceTrack installer (Inno Setup)
        working-directory: agent/packaging
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\WorkforceAgent-SystemService.iss

      # Only upload artifact on manual test runs — release builds are published
      # directly to GitHub Releases below (no need to store them twice).
      - uses: actions/upload-artifact@v4.4.3
        if: "!startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch'"
        with:
          name: WorkforceTrack-windows-installer
          path: agent/packaging/dist/WorkforceTrack-Setup.exe
          retention-days: 1

      - name: Publish Windows installer to release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: agent/packaging/dist/WorkforceTrack-Setup.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt "pyinstaller<6.22.0"

      - name: Generate icons
        run: python agent/packaging/make_icons.py

      - name: Install build dependencies
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install create-dmg

      - name: Build WorkforceTrack .app and .dmg
        run: |
          chmod +x agent/packaging/macos/build_dmg_system_service.sh
          bash agent/packaging/macos/build_dmg_system_service.sh

      # Only upload artifact on manual test runs — release builds go to GitHub Releases.
      - uses: actions/upload-artifact@v4.4.3
        if: "!startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch'"
        with:
          name: WorkforceTrack-macos-installer
          path: agent/packaging/dist/WorkforceTrack.dmg
          retention-days: 1

      - name: Publish macOS installer to release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            agent/packaging/dist/WorkforceTrack.dmg
            agent/packaging/dist/WorkforceTrack.app.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xdotool xprintidle scrot

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt "pyinstaller<6.22.0"

      - name: Build standalone Linux executable
        working-directory: agent
        run: |
          pyinstaller --onefile --name WorkforceTrack agent.py

      # Only upload artifact on manual test runs — release builds go to GitHub Releases.
      - uses: actions/upload-artifact@v4.4.3
        if: "!startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch'"
        with:
          name: WorkforceTrack-linux
          path: agent/dist/WorkforceTrack
          retention-days: 1

      - name: Publish Linux binary to release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: agent/dist/WorkforceTrack
