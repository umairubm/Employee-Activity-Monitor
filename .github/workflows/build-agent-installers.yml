name: Build Agent Installers

# Builds the desktop agent into a Windows .exe installer, a macOS .dmg, and a
# Linux .tar.gz, then attaches all three to a GitHub Release. Each platform's
# binary cannot be cross-compiled, so the work runs on native windows-latest /
# macos-latest / ubuntu-latest runners.
#
# Trigger by pushing a tag like `agent-v1.2.30`, or run manually from the Actions
# tab (workflow_dispatch) and supply the tag to publish.

on:
  push:
    tags:
      - "agent-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create/publish (e.g. agent-v1.2.30)"
        required: true
        default: "agent-v1.2.30"
      windows_unsigned_dev:
        description: "Windows-only UNSIGNED development artifact (never publish)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install agent dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y python3-dev pkg-config libcairo2-dev libgirepository1.0-dev gstreamer1.0-pipewire gstreamer1.0-plugins-base gstreamer1.0-plugins-good gir1.2-gstreamer-1.0 python3-gst-1.0
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt

      - name: Run monitor behavior and startup smoke tests
        run: |
          python -m unittest agent.tests.test_monitor agent.tests.test_startup_smoke agent.tests.test_commands agent.tests.test_background_processes agent.packaging.windows.test_installer_contracts
          python -m unittest discover -s agent/packaging/windows/smoke -p "test_*.py"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify Node update contracts
        run: node --test agent-node/test/command-runner.test.mjs agent-node/test/windows-installer-verification.test.mjs

  windows:
    needs: release-checks
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4


      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt pyinstaller

      - name: Generate icons
        run: python agent/packaging/make_icons.py

      - name: Build agent executable
        working-directory: agent/packaging
        run: |
          pyinstaller --noconfirm WorkforceAgent.spec
          pyinstaller --noconfirm WorkforceAgent-Uninstaller.spec


      - name: Build installer (Inno Setup)
        working-directory: agent/packaging
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\WorkforceAgent.iss


      - name: Generate checksum
        if: ${{ !inputs.windows_unsigned_dev }}
        shell: pwsh
        run: |
          $hash = (Get-FileHash agent/packaging/dist/WorkforceAgent-Setup-windows.exe -Algorithm SHA256).Hash
          $hash | Out-File -FilePath agent/packaging/dist/WorkforceAgent-Setup-windows.exe.sha256 -Encoding ascii -NoNewline

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.windows_unsigned_dev }}
        with:
          name: windows-installer
          path: |
            agent/packaging/dist/WorkforceAgent-Setup-windows.exe
            agent/packaging/dist/WorkforceAgent-Setup-windows.exe.sha256*
            agent/packaging/dist/WorkforceAgent-Uninstaller.exe
          if-no-files-found: error


      - name: Label unsigned development installer
        if: ${{ inputs.windows_unsigned_dev }}
        shell: pwsh
        run: |
          Rename-Item agent/packaging/dist/WorkforceAgent-Setup-windows.exe WorkforceAgent-Setup-UNSIGNED-DEVELOPMENT.exe

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.windows_unsigned_dev }}
        with:
          name: windows-UNSIGNED-DEVELOPMENT-not-for-rollout
          path: agent/packaging/dist/WorkforceAgent-Setup-UNSIGNED-DEVELOPMENT.exe
          if-no-files-found: error

  windows-publish:
    if: ${{ !inputs.windows_unsigned_dev }}
    needs: [windows]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: signed-release
      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            signed-release/WorkforceAgent-Setup-windows.exe
            signed-release/WorkforceAgent-Setup-windows.exe.sha256
            signed-release/WorkforceAgent-Uninstaller.exe

  macos:
    if: ${{ !inputs.windows_unsigned_dev }}
    needs: release-checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt pyinstaller

      - name: Generate icons
        run: python agent/packaging/make_icons.py

      - name: Import Apple Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$MACOS_CERTIFICATE_PASSWORD" ] || [ -z "$KEYCHAIN_PASSWORD" ]; then
            echo "Missing macOS signing secrets. Skipping keychain setup."
            exit 0
          fi
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/workforce-signing.keychain-db"
          echo "$MACOS_CERTIFICATE" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build .app and .dmg
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash agent/packaging/macos/build_dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            agent/packaging/dist/WorkforceAgent-macos.dmg
            agent/packaging/dist/WorkforceAgent-macos-*.app.zip

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: |
            agent/packaging/dist/WorkforceAgent-macos.dmg
            agent/packaging/dist/WorkforceAgent-macos-*.app.zip

  linux:
    if: ${{ !inputs.windows_unsigned_dev }}
    needs: release-checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y python3-tk python3-venv python3-dev pkg-config libcairo2-dev libgirepository1.0-dev gstreamer1.0-pipewire gstreamer1.0-plugins-base gstreamer1.0-plugins-good gir1.2-gstreamer-1.0 python3-gst-1.0
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r agent/requirements.txt pyinstaller

      - name: Generate icons
        run: .venv/bin/python agent/packaging/make_icons.py

      - name: Build agent executable
        working-directory: agent/packaging
        run: ${{ github.workspace }}/.venv/bin/pyinstaller --noconfirm WorkforceAgent.spec

      - name: Verify PyGObject packaging
        working-directory: agent/packaging
        run: |
          echo 'import sys; import gi; gi.require_version("GLib", "2.0"); gi.require_version("Gst", "1.0"); from gi.repository import GLib, Gio, Gst; Gst.init(None); pipe = Gst.parse_launch("pipewiresrc ! videoconvert ! appsink name=sink"); sink = pipe.get_by_name("sink"); sys.exit(0 if sink else 1)' > test_gi.py
          ${{ github.workspace }}/.venv/bin/pyinstaller --noconfirm --onefile --hidden-import gi.repository.Gio --hidden-import gi.repository.GLib --hidden-import gi.repository.Gst test_gi.py
          ./dist/test_gi


      - name: Package tarball
        working-directory: agent/packaging
        run: |
          chmod +x dist/WorkforceAgent
          cp linux/install.sh dist/install.sh
          chmod +x dist/install.sh
          tar -czf dist/WorkforceAgent-linux.tar.gz -C dist WorkforceAgent install.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: agent/packaging/dist/WorkforceAgent-linux.tar.gz

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: agent/packaging/dist/WorkforceAgent-linux.tar.gz
