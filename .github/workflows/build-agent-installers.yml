name: Build Agent Installers

on:
  push:
    tags:
      - "agent-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create/publish (e.g. agent-v1.2.10)"
        required: true
        default: "agent-v1.2.10"

permissions:
  contents: write

# ── Opt into Node.js 24 now (required after June 16 2026) ─────────────────────
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Create the GitHub Release first so build jobs don't race to create it ───
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve tag name
        id: tag
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: false

  # ── Windows ─────────────────────────────────────────────────────────────────
  windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt "pyinstaller<6.22.0" msvc-runtime

      - name: Generate icons
        run: python agent/packaging/make_icons.py

      - name: Build WorkforceTrack executable
        working-directory: agent/packaging
        shell: pwsh
        run: |
          pyinstaller --noconfirm WorkforceAgent-SystemService.spec

          if (-not (Test-Path "dist\WorkforceTrack.exe")) {
            throw "PyInstaller failed to produce dist\WorkforceTrack.exe"
          }
          Write-Host "Built: dist\WorkforceTrack.exe"

      - name: Build WorkforceTrack installer (Inno Setup)
        working-directory: agent/packaging
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\WorkforceAgent-SystemService.iss

      # Only upload artifact on manual test runs — release builds go to GitHub Releases.
      - uses: actions/upload-artifact@v4.4.3
        if: "!startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch'"
        with:
          name: WorkforceTrack-windows-installer
          path: agent/packaging/dist/WorkforceTrack-Setup.exe
          retention-days: 1

      - name: Upload Windows installer to release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: gh release upload "${{ needs.create-release.outputs.tag }}" "agent/packaging/dist/WorkforceTrack-Setup.exe" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── macOS ───────────────────────────────────────────────────────────────────
  macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt "pyinstaller<6.22.0"

      - name: Generate icons
        run: python agent/packaging/make_icons.py

      - name: Install build dependencies
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install create-dmg

      - name: Build WorkforceTrack .app and .dmg
        run: |
          chmod +x agent/packaging/macos/build_dmg_system_service.sh
          bash agent/packaging/macos/build_dmg_system_service.sh

      # Only upload artifact on manual test runs — release builds go to GitHub Releases.
      - uses: actions/upload-artifact@v4.4.3
        if: "!startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch'"
        with:
          name: WorkforceTrack-macos-installer
          path: agent/packaging/dist/WorkforceTrack.dmg
          retention-days: 1

      - name: Upload macOS installer to release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: gh release upload "${{ needs.create-release.outputs.tag }}" "agent/packaging/dist/WorkforceTrack.dmg" "agent/packaging/dist/WorkforceTrack.app.zip" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Linux ───────────────────────────────────────────────────────────────────
  linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xdotool xprintidle scrot

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt "pyinstaller<6.22.0"

      - name: Build standalone Linux executable
        working-directory: agent
        run: |
          pyinstaller --onefile --name WorkforceTrack agent.py

      # Only upload artifact on manual test runs — release builds go to GitHub Releases.
      - uses: actions/upload-artifact@v4.4.3
        if: "!startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch'"
        with:
          name: WorkforceTrack-linux
          path: agent/dist/WorkforceTrack
          retention-days: 1

      - name: Upload Linux binary to release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: gh release upload "${{ needs.create-release.outputs.tag }}" "agent/dist/WorkforceTrack" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
