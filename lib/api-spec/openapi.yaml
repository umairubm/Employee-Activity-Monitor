  /sync/activity:
    post:
      operationId: syncActivity
      tags: [sync]
      summary: Batch upload of activity logs and media
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncActivityRequest"
      responses:
        "200":
          description: Sync successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required: [username, password]
    AuthUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [super_user, company_admin, manager, team_member]
        companyId:
          type: [string, "null"]
          format: uuid
        createdAt:
          type: string
          format: date-time
      required: [id, username, email, role, createdAt]
    OkResult:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]
    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [active, suspended]
        maxManagers:
          type: [integer, "null"]
        maxDevices:
          type: [integer, "null"]
        createdById:
          type: [string, "null"]
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, status, createdAt, updatedAt]
    CompanyUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [super_user, company_admin, manager, team_member]
        createdAt:
          type: string
          format: date-time
      required: [id, username, email, role]
    SecuritySettings:
      type: object
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        passwordMinLength:
          type: integer
        passwordRequireUppercase:
          type: boolean
        passwordRequireNumber:
          type: boolean
        passwordRequireSymbol:
          type: boolean
        sessionTimeoutMinutes:
          type: integer
        allowedIpRanges:
          type: array
          items:
            type: string
        mfaRequired:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - companyId
        - passwordMinLength
        - passwordRequireUppercase
        - passwordRequireNumber
        - passwordRequireSymbol
        - sessionTimeoutMinutes
        - allowedIpRanges
        - mfaRequired
    CompanyDetail:
      allOf:
        - $ref: "#/components/schemas/Company"
        - type: object
          properties:
            securitySettings:
              oneOf:
                - $ref: "#/components/schemas/SecuritySettings"
                - type: "null"
            admins:
              type: array
              items:
                $ref: "#/components/schemas/CompanyUser"
          required: [admins]
    CreateAdminRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required: [username, email, password]
    UpdateCompanyLimitsRequest:
      type: object
      properties:
        maxManagers:
          type: [integer, "null"]
          minimum: 0
        maxDevices:
          type: [integer, "null"]
          minimum: 0
    CreateCompanyRequest:
      type: object
      properties:
        name:
          type: string
        admin:
          $ref: "#/components/schemas/CreateAdminRequest"
      required: [name]
    CreateCompanyResult:
      type: object
      properties:
        company:
          $ref: "#/components/schemas/Company"
        admin:
          oneOf:
            - $ref: "#/components/schemas/CompanyUser"
            - type: "null"
      required: [company]
    CreateManagerRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [manager, team_member]
      required: [username, email, password]
    UpdateManagerRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [manager, team_member]
    UpdateSecuritySettingsRequest:
      type: object
      properties:
        passwordMinLength:
          type: integer
          minimum: 6
          maximum: 128
        passwordRequireUppercase:
          type: boolean
        passwordRequireNumber:
          type: boolean
        passwordRequireSymbol:
          type: boolean
        sessionTimeoutMinutes:
          type: integer
          minimum: 5
          maximum: 43200
        allowedIpRanges:
          type: array
          items:
            type: string
        mfaRequired:
          type: boolean
    DeviceAlertItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        field:
          type: string
        oldValue:
          type: [string, "null"]
        newValue:
          type: [string, "null"]
        detectedAt:
          type: string
          format: date-time
        acknowledgedAt:
          type: [string, "null"]
          format: date-time
        acknowledgedByUsername:
          type: [string, "null"]
      required:
        - id
        - deviceId
        - field
        - detectedAt
    AcknowledgeAllResult:
      type: object
      properties:
        acknowledged:
          type: integer
      required:
        - acknowledged
    DeviceItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        hardwareHash:
          type: string
        systemName:
          type: string
        osType:
          type: string
          enum: [windows, macos, linux]
        agentVersion:
          type: [string, "null"]
        assignedUserId:
          type: [string, "null"]
          format: uuid
        consentAcknowledgedAt:
          type: [string, "null"]
          format: date-time
        consentName:
          type: [string, "null"]
        enrolledAt:
          type: [string, "null"]
          format: date-time
        lastSeenAt:
          type: [string, "null"]
          format: date-time
        isLocked:
          type: boolean
        screenshotMinMinutes:
          type: integer
        screenshotMaxMinutes:
          type: integer
        idleThresholdSeconds:
          type: integer
        syncIntervalSeconds:
          type: integer
        monitoringEnabled:
          type: boolean
        deviceGroup:
          type: string
        tokenLabel:
          type: [string, "null"]
          description: Label of the enrollment token this device was enrolled with.
        online:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        systemInfo:
          type: [object, "null"]
          additionalProperties: true
          description: Latest hardware/system inventory snapshot reported by the agent.
        alertCount:
          type: integer
          description: Number of unacknowledged hardware-change alerts for this device.
      required:
        - id
        - hardwareHash
        - systemName
        - osType
        - isLocked
        - screenshotMinMinutes
        - screenshotMaxMinutes
        - idleThresholdSeconds
        - syncIntervalSeconds
        - monitoringEnabled
        - deviceGroup
        - online
        - createdAt
        - updatedAt
    DeviceGroupInput:
      type: object
      properties:
        deviceGroup:
          type: string
          minLength: 1
      required: [deviceGroup]
    DeviceConfigInput:
      type: object
      properties:
        monitoringEnabled:
          type: boolean
        screenshotMinMinutes:
          type: integer
          minimum: 1
          maximum: 1440
        screenshotMaxMinutes:
          type: integer
          minimum: 1
          maximum: 1440
        idleThresholdSeconds:
          type: integer
          minimum: 10
          maximum: 7200
        syncIntervalSeconds:
          type: integer
          minimum: 10
          maximum: 3600
      required:
        - monitoringEnabled
        - screenshotMinMinutes
        - screenshotMaxMinutes
        - idleThresholdSeconds
        - syncIntervalSeconds
    BulkUpdateResult:
      type: object
      properties:
        updated:
          type: integer
      required: [updated]
    GroupRenameInput:
      type: object
      properties:
        from:
          type: string
          minLength: 1
        to:
          type: string
          minLength: 1
      required: [from, to]
    DeviceCommandItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        issuedById:
          type: [string, "null"]
          format: uuid
        issuedByUsername:
          type: [string, "null"]
        commandType:
          type: string
          enum: [lock_screen, logout_user, update_config]
        payload:
          type: [string, "null"]
        status:
          type: string
          enum: [pending, acknowledged, completed, failed, cancelled]
        reason:
          type: [string, "null"]
        cancelReason:
          type: [string, "null"]
        cancelledById:
          type: [string, "null"]
          format: uuid
        cancelledByUsername:
          type: [string, "null"]
        issuedAt:
          type: string
          format: date-time
        acknowledgedAt:
          type: [string, "null"]
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        cancelledAt:
          type: [string, "null"]
          format: date-time
      required: [id, deviceId, commandType, status, issuedAt]
    CancelCommandRequest:
      type: object
      properties:
        reason:
          type: string
    IssueCommandRequest:
      type: object
      properties:
        commandType:
          type: string
          enum: [lock_screen, logout_user]
        reason:
          type: string
      required: [commandType]
    ActivityLogRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        userId:
          type: [string, "null"]
          format: uuid
        processName:
          type: string
        windowTitle:
          type: [string, "null"]
        categoryId:
          type: [string, "null"]
          format: uuid
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        durationSeconds:
          type: integer
        idleSeconds:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - deviceId
        - processName
        - startedAt
        - endedAt
        - durationSeconds
        - idleSeconds
        - createdAt
    ScreenshotListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        userId:
          type: [string, "null"]
          format: uuid
        fileSizeBytes:
          type: integer
        flagged:
          type: boolean
        capturedAt:
          type: string
          format: date-time
        imageUrl:
          type: string
      required: [id, deviceId, fileSizeBytes, flagged, capturedAt, imageUrl]
    ScreenshotFlagInput:
      type: object
      properties:
        flagged:
          type: boolean
      required: [flagged]
    SummaryResponse:
      type: object
      properties:
        devices:
          type: object
          properties:
            total:
              type: integer
            online:
              type: integer
          required: [total, online]
        usersCount:
          type: integer
        screenshotsToday:
          type: integer
        pendingCommands:
          type: integer
        activityToday:
          type: object
          properties:
            productiveSeconds:
              type: integer
            unproductiveSeconds:
              type: integer
            neutralSeconds:
              type: integer
            undefinedSeconds:
              type: integer
            totalSeconds:
              type: integer
          required:
            - productiveSeconds
            - unproductiveSeconds
            - neutralSeconds
            - undefinedSeconds
            - totalSeconds
      required:
        - devices
        - usersCount
        - screenshotsToday
        - pendingCommands
        - activityToday
    LeaderboardItem:
      type: object
      properties:
        deviceId:
          type: string
          format: uuid
        systemName:
          type: string
        productiveSeconds:
          type: integer
        totalSeconds:
          type: integer
        score:
          type: integer
      required: [deviceId, systemName, productiveSeconds, totalSeconds, score]
    GroupComparisonItem:
      type: object
      properties:
        group:
          type: string
        deviceCount:
          type: integer
        productiveSeconds:
          type: integer
        totalSeconds:
          type: integer
        score:
          type: integer
      required: [group, deviceCount, productiveSeconds, totalSeconds, score]
    CategoryItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pattern:
          type: string
        displayName:
          type: string
        classification:
          type: string
          enum: [productive, unproductive, neutral, undefined]
        createdById:
          type: [string, "null"]
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, pattern, displayName, classification, createdAt, updatedAt]
    UpdateCategoryRequest:
      type: object
      properties:
        classification:
          type: string
          enum: [productive, unproductive, neutral, undefined]
        displayName:
          type: string
    AttendanceSettingsItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: [string, "null"]
          format: uuid
        workStartTime:
          type: string
        halfDayLateThreshold:
          type: string
          description: Arrive-after cutoff (HH:MM) that downgrades a day to half-day.
        halfDayMiddayCutoff:
          type: string
          description: Leave-before cutoff (HH:MM) that downgrades a day to half-day.
        halfDayThresholdHours:
          type: number
        requiredHoursNormal:
          type: number
        requiredHoursFriday:
          type: number
        timezone:
          type: string
          description: >-
            Organization timezone (IANA name, e.g. "Asia/Karachi", or "UTC").
            Attendance day buckets and late/early classification use this zone.
        workingDays:
          type: array
