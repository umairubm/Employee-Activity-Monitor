openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification for Workforce Analytics & IT Management
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Admin authentication
  - name: devices
    description: Device management and IT commands
  - name: activity
    description: Activity logs
  - name: screenshots
    description: Screenshot gallery
  - name: reports
    description: Dashboard reports
  - name: attendance
    description: Attendance tracking
  - name: categories
    description: App productivity classification
  - name: tokens
    description: Enrollment tokens
  - name: users
    description: User directory
  - name: downloads
    description: Desktop agent installer downloads
  - name: sync
    description: Device agent synchronization
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Exchange credentials for a session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Return the current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"

  /devices:
    get:
      operationId: listDevices
      tags: [devices]
      summary: List enrolled devices
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceItem"
  /devices/{id}:
    get:
      operationId: getDevice
      tags: [devices]
      summary: Get a device
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceItem"
  /devices/{id}/commands:
    get:
      operationId: getDeviceCommands
      tags: [devices]
      summary: Get command history for a device
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Commands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceCommandItem"
    post:
      operationId: issueDeviceCommand
      tags: [devices]
      summary: Issue an authorized IT command
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueCommandRequest"
      responses:
        "201":
          description: Command issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCommandItem"
  /devices/{id}/commands/{commandId}/cancel:
    patch:
      operationId: cancelDeviceCommand
      tags: [devices]
      summary: Cancel a still-pending IT command
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: commandId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelCommandRequest"
      responses:
        "200":
          description: Cancelled command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCommandItem"

  /devices/{id}/group:
    patch:
      operationId: setDeviceGroup
      tags: [devices]
      summary: Assign a device to a group
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceGroupInput"
      responses:
        "200":
          description: Updated device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceItem"
  /devices/config:
    patch:
      operationId: applyDeviceConfigToAll
      tags: [devices]
      summary: Apply agent configuration to all devices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceConfigInput"
      responses:
        "200":
          description: Number of devices updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUpdateResult"
  /devices/{id}/config:
    patch:
      operationId: updateDeviceConfig
      tags: [devices]
      summary: Update a device's agent configuration
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceConfigInput"
      responses:
        "200":
          description: Updated device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceItem"
  /devices/{id}/alerts:
    get:
      operationId: getDeviceAlerts
      tags: [devices]
      summary: List hardware/system change alerts for a device
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceAlertItem"
  /devices/{id}/alerts/acknowledge-all:
    patch:
      operationId: acknowledgeAllDeviceAlerts
      tags: [devices]
      summary: Acknowledge every open alert for a device
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Number of alerts acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcknowledgeAllResult"
  /devices/{id}/alerts/{alertId}/acknowledge:
    patch:
      operationId: acknowledgeDeviceAlert
      tags: [devices]
      summary: Acknowledge a single hardware-change alert
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: alertId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Acknowledged alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAlertItem"
  /downloads:
    get:
      operationId: listDownloads
      tags: [downloads]
      summary: List available desktop agent installers
      responses:
        "200":
          description: Installer availability per platform
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadList"
  /devices/groups/rename:
    post:
      operationId: renameDeviceGroup
      tags: [devices]
      summary: Rename a device group across all devices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupRenameInput"
      responses:
        "200":
          description: Rename result
          content:
            application/json:
              schema:
                type: object
                properties:
                  renamed:
                    type: integer
                required: [renamed]

  /activity:
    get:
      operationId: getActivityLogs
      tags: [activity]
      summary: Get activity logs
      parameters:
        - name: deviceId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: userId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: group
          in: query
          required: false
          description: Restrict to devices in this group
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Activity logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityLogRecord"
  /activity/range:
    get:
      operationId: getActivityRange
      tags: [activity]
      summary: Activity logs within a time range (for daily aggregation)
      description: >
        Returns raw activity logs whose startedAt falls within [from, to). Used by
        the dashboard to aggregate a full day of activity client-side. Unlike
        /activity this is not capped at 200 rows.
      parameters:
        - name: from
          in: query
          required: true
          description: Inclusive range start (ISO date-time)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: Exclusive range end (ISO date-time)
          schema:
            type: string
            format: date-time
        - name: group
          in: query
          required: false
          description: Restrict to devices in this group
          schema:
            type: string
        - name: deviceId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Activity logs in range
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityLogRecord"
  /activity/timeline:
    get:
      operationId: getTimeline
      tags: [activity]
      summary: Get timeline view
      parameters:
        - name: deviceId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Timeline events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityLogRecord"

  /screenshots:
    get:
      operationId: listScreenshots
      tags: [screenshots]
      summary: List screenshot metadata
      parameters:
        - name: deviceId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: flagged
          in: query
          required: false
          schema:
            type: boolean
        - name: group
          in: query
          required: false
          description: Restrict to devices in this group
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Only screenshots captured at or after this instant (inclusive)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Only screenshots captured strictly before this instant (exclusive)
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Screenshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScreenshotListItem"
  /screenshots/count:
    get:
      operationId: getScreenshotCount
      tags: [screenshots]
      summary: Count screenshots matching the given filters
      parameters:
        - name: deviceId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: flagged
          in: query
          required: false
          schema:
            type: boolean
        - name: group
          in: query
          required: false
          description: Restrict to devices in this group
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Only screenshots captured at or after this instant (inclusive)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Only screenshots captured strictly before this instant (exclusive)
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Screenshot count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                required: [count]
  /screenshots/{id}:
    delete:
      operationId: deleteScreenshot
      tags: [screenshots]
      summary: Permanently delete a screenshot (does not adjust tracked hours)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
  /screenshots/{id}/flag:
    patch:
      operationId: flagScreenshot
      tags: [screenshots]
      summary: Flag or unflag a screenshot
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreenshotFlagInput"
      responses:
        "200":
          description: Updated flag state
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  flagged:
                    type: boolean
                required: [id, flagged]

  /reports/summary:
    get:
      operationId: getSummary
      tags: [reports]
      summary: Dashboard overview KPIs
      parameters:
        - name: group
          in: query
          required: false
          description: Restrict aggregation to devices in this group
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            description: Range start day in YYYY-MM-DD format (inclusive); defaults to today
        - name: to
          in: query
          required: false
          schema:
            type: string
            description: Range end day in YYYY-MM-DD format (inclusive); defaults to today
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryResponse"
  /reports/leaderboard:
    get:
      operationId: getLeaderboard
      tags: [reports]
      summary: Per-device productivity over a date range
      parameters:
        - name: group
          in: query
          required: false
          description: Restrict aggregation to devices in this group
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            description: Range start day in YYYY-MM-DD format (inclusive); defaults to today
        - name: to
          in: query
          required: false
          schema:
            type: string
            description: Range end day in YYYY-MM-DD format (inclusive); defaults to today
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardItem"
  /reports/group-comparison:
    get:
      operationId: getGroupComparison
      tags: [reports]
      summary: Per-group productivity comparison over a date range
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            description: Range start day in YYYY-MM-DD format (inclusive); defaults to today
        - name: to
          in: query
          required: false
          schema:
            type: string
            description: Range end day in YYYY-MM-DD format (inclusive); defaults to today
      responses:
        "200":
          description: Group comparison
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupComparisonItem"

  /attendance/settings:
    get:
      operationId: getAttendanceSettings
      tags: [attendance]
      summary: Get global attendance rules
      responses:
        "200":
          description: Attendance settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSettingsItem"
    put:
      operationId: updateAttendanceSettings
      tags: [attendance]
      summary: Update global attendance rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceSettingsUpdate"
      responses:
        "200":
          description: Updated attendance settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSettingsItem"
  /attendance/overrides:
    get:
      operationId: getAttendanceOverrides
      tags: [attendance]
      summary: List per-device and per-team attendance overrides
      responses:
        "200":
          description: Attendance overrides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceOverrideItem"
    put:
      operationId: upsertAttendanceOverride
      tags: [attendance]
      summary: Create or replace a per-device or per-team attendance override
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceOverrideUpsert"
      responses:
        "200":
          description: Saved override
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceOverrideItem"
  /attendance/overrides/{id}:
    delete:
      operationId: deleteAttendanceOverride
      tags: [attendance]
      summary: Remove a per-device or per-team attendance override
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Deleted override id
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                required: [id]
  /attendance:
    get:
      operationId: getAttendanceReport
      tags: [attendance]
      summary: Per-device daily attendance report
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            description: Day in YYYY-MM-DD format; defaults to today
        - name: group
          in: query
          required: false
          description: Restrict to devices in this group
          schema:
            type: string
      responses:
        "200":
          description: Attendance report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceReport"
  /attendance/range:
    get:
      operationId: getAttendanceRangeReport
      tags: [attendance]
      summary: Per-device attendance summary across a date range
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            description: Range start day in YYYY-MM-DD format (inclusive)
        - name: to
          in: query
          required: true
          schema:
            type: string
            description: Range end day in YYYY-MM-DD format (inclusive)
        - name: group
          in: query
          required: false
          description: Restrict to devices in this group
          schema:
            type: string
      responses:
        "200":
          description: Attendance range report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRangeReport"

  /timesheets:
    get:
      operationId: getTimesheet
      tags: [timesheets]
      summary: Per-device, per-day work metrics with range totals
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            description: Range start day in YYYY-MM-DD format (inclusive)
        - name: to
          in: query
          required: true
          schema:
            type: string
            description: Range end day in YYYY-MM-DD format (inclusive)
        - name: group
          in: query
          required: false
          description: Restrict to devices in this group
          schema:
            type: string
      responses:
        "200":
          description: Timesheet report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimesheetReport"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects with task aggregates
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, on_hold, completed, archived]
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectItem"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectItem"
  /projects/{id}:
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectItem"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project and its tasks
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
  /projects/{id}/tasks:
    get:
      operationId: listProjectTasks
      tags: [projects]
      summary: List tasks for a project
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskItem"
    post:
      operationId: createTask
      tags: [projects]
      summary: Create a task in a project
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskItem"
  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task (status, assignment, logged time)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskItem"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted

  /shifts:
    get:
      operationId: listShifts
      tags: [shifts]
      summary: List work shifts
      responses:
        "200":
          description: Shifts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShiftItem"
    post:
      operationId: createShift
      tags: [shifts]
      summary: Create a work shift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShiftRequest"
      responses:
        "201":
          description: Shift created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftItem"
  /shifts/{id}:
    patch:
      operationId: updateShift
      tags: [shifts]
      summary: Update a work shift
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShiftRequest"
      responses:
        "200":
          description: Updated shift
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftItem"
    delete:
      operationId: deleteShift
      tags: [shifts]
      summary: Delete a work shift
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
  /leave-requests:
    get:
      operationId: listLeaveRequests
      tags: [leave]
      summary: List leave requests
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected, cancelled]
        - name: userId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Leave requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaveRequestItem"
    post:
      operationId: createLeaveRequest
      tags: [leave]
      summary: Apply for leave
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeaveRequest"
      responses:
        "201":
          description: Leave request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequestItem"
  /leave-requests/{id}:
    patch:
      operationId: updateLeaveRequest
      tags: [leave]
