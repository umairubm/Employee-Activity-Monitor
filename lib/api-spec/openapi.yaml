            application/json:
              schema:
                $ref: "#/components/schemas/SecuritySettings"
    put:
      operationId: updateSecuritySettings
      tags: [security-settings]
      summary: Update this tenant's security policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSecuritySettingsRequest"
      responses:
        "200":
          description: Security settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecuritySettings"

  /sync/heartbeat:
